[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgm"
version = "0.1.0"
description = "MIT 6.S978 Deep Generative Models - Learning implementations in PyTorch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["deep-learning", "generative-models", "pytorch", "vae", "gan", "diffusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
webapp = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]
chat = [
    "anthropic>=0.39.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
    "PyMuPDF>=1.24.0",
    "python-dotenv>=1.0.0",
]
all = ["dgm[webapp,chat,dev]"]

[project.urls]
Homepage = "https://github.com/yourusername/S978-Deep-Generative-Models-2024"
Course = "https://mit-6s978.github.io/schedule.html"

[tool.hatch.build.targets.wheel]
packages = ["src/dgm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
